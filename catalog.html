<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #212529; }
        .sidebar .nav-link { color: #8a8d93; }
        .sidebar .nav-link.active { background-color: #0d6efd; color: white !important; }
        .sidebar .nav-link:hover:not(.active) { color: white; }
        .placeholder-img { background-color: #868e96; width: 100%; height: 225px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
            <div class="d-flex align-items-center mb-3 text-white text-decoration-none">
                <span class="fs-4 fw-bold">Меню</span>
            </div>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="/" class="nav-link">Главная</a></li>
                <li><a href="/catalog" class="nav-link active">Каталог</a></li>
                <li><a href="/contacts" class="nav-link">Контакты</a></li>
            </ul>
        </nav>

        <!-- Контент (Сетка товаров) -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
            <h1 class="display-4 text-center mb-5">Каталог товаров</h1>
            <div class="row">
                <!-- Товар 1 -->
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm">
                        <div class="placeholder-img">Эскиз картинки</div>
                        <div class="card-body">
                            <p class="card-text">Краткое описание демонстрационного товара для проверки адаптивной сетки Bootstrap.</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <button type="button" class="btn btn-sm btn-outline-secondary">Посмотреть</button>
                                <small class="text-muted">9 мин</small>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Товар 2 -->
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm">
                        <div class="placeholder-img">Эскиз картинки</div>
                        <div class="card-body">
                            <p class="card-text">Еще один демонстрационный товар. Карточки будут красиво перестраиваться на экранах телефонов.</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <button type="button" class="btn btn-sm btn-outline-secondary">Посмотреть</button>
                                <small class="text-muted">15 min</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
